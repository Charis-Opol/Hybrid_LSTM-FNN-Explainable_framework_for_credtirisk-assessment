<title>Borrower Explorer — Hybrid vs. Transformer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --ink: #1b1f27;
    --paper: #f6f2ea;
    --paper-raised: #ffffff;
    --accent: #b9812f;
    --accent-soft: #e4c894;
    --risk: #ab4a3d;
    --risk-soft: #ecd9d4;
    --safe: #3c7a80;
    --safe-soft: #d8e6e5;
    --line: #d8d0c0;
    --line-strong: #b9ae95;
    --text: #2a2620;
    --text-dim: #6b6355;
    --shadow: 0 1px 2px rgba(30, 24, 10, 0.06), 0 6px 20px -8px rgba(30, 24, 10, 0.18);
  }

  :root[data-theme="dark"] {
    --ink: #eae4d8;
    --paper: #17181b;
    --paper-raised: #1f2024;
    --accent: #d9a352;
    --accent-soft: #4a3a1e;
    --risk: #d9776a;
    --risk-soft: #3c2523;
    --safe: #6fb0b4;
    --safe-soft: #1f3436;
    --line: #34353a;
    --line-strong: #46474d;
    --text: #e7e1d4;
    --text-dim: #9b9486;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -10px rgba(0, 0, 0, 0.6);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #eae4d8;
      --paper: #17181b;
      --paper-raised: #1f2024;
      --accent: #d9a352;
      --accent-soft: #4a3a1e;
      --risk: #d9776a;
      --risk-soft: #3c2523;
      --safe: #6fb0b4;
      --safe-soft: #1f3436;
      --line: #34353a;
      --line-strong: #46474d;
      --text: #e7e1d4;
      --text-dim: #9b9486;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -10px rgba(0, 0, 0, 0.6);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--text);
    font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .serif {
    font-family: "Iowan Old Style", "Palatino Linotype", "URW Palladio L", Georgia, serif;
  }

  .mono {
    font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  .label {
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 10.5px;
    color: var(--text-dim);
    font-weight: 600;
  }

  header.app-header {
    padding: 22px 28px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  header.app-header h1 {
    font-size: 22px;
    margin: 0;
    font-weight: 600;
    text-wrap: balance;
  }

  header.app-header p {
    margin: 4px 0 0;
    color: var(--text-dim);
    max-width: 62ch;
    font-size: 13px;
  }

  .app-shell {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: calc(100vh - 90px);
  }

  @media (max-width: 860px) {
    .app-shell { grid-template-columns: 1fr; }
    .sidebar { max-height: 260px; }
  }

  .sidebar {
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    background: var(--paper);
  }

  .sidebar-controls {
    padding: 14px 16px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-bottom: 1px solid var(--line);
  }

  .sidebar-controls input, .sidebar-controls select {
    font: inherit;
    padding: 7px 9px;
    border-radius: 6px;
    border: 1px solid var(--line-strong);
    background: var(--paper-raised);
    color: var(--text);
  }

  .sidebar-list {
    overflow-y: auto;
    flex: 1;
  }

  .borrower-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
    font-size: 12.5px;
  }

  .borrower-row:hover { background: var(--paper-raised); }
  .borrower-row.active { background: var(--accent-soft); }

  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.pos { background: var(--risk); }
  .dot.neg { background: var(--safe); }

  .borrower-row .bid { font-weight: 600; }
  .borrower-row .risks {
    margin-left: auto;
    display: flex;
    gap: 6px;
    font-size: 11px;
  }
  .risks span { padding: 1px 5px; border-radius: 4px; background: var(--paper-raised); }

  main {
    padding: 24px 32px 60px;
    overflow-x: hidden;
  }

  .detail-header {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  .detail-header h2 {
    font-size: 20px;
    margin: 0;
    font-weight: 600;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .pill.pos { background: var(--risk-soft); color: var(--risk); }
  .pill.neg { background: var(--safe-soft); color: var(--safe); }

  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 720px) {
    .columns { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 20px;
    box-shadow: var(--shadow);
  }

  .card h3 {
    margin: 0 0 2px;
    font-size: 15px;
    font-weight: 700;
  }
  .card .subtitle {
    font-size: 11.5px;
    color: var(--text-dim);
    margin-bottom: 14px;
  }

  .risk-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 16px;
  }
  .risk-value {
    font-size: 26px;
    font-weight: 700;
  }
  .risk-band {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-weight: 700;
  }
  .risk-band.low { background: var(--safe-soft); color: var(--safe); }
  .risk-band.moderate { background: var(--accent-soft); color: var(--accent); }
  .risk-band.high { background: var(--risk-soft); color: var(--risk); }

  .section-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    font-weight: 600;
    margin: 14px 0 6px;
  }

  .attn-strip {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 46px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2px;
  }
  .attn-bar {
    flex: 1;
    background: var(--accent);
    border-radius: 2px 2px 0 0;
    min-height: 2px;
    position: relative;
  }
  .attn-months {
    display: flex;
    justify-content: space-between;
    font-size: 8.5px;
    color: var(--text-dim);
    margin-top: 3px;
  }

  .driver {
    display: grid;
    grid-template-columns: 1fr 90px;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    padding: 5px 0;
  }
  .driver .fname {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .driver-bar-track {
    position: relative;
    height: 10px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
  }
  .driver-bar-fill {
    position: absolute;
    top: 0; bottom: 0;
    border-radius: 3px;
  }
  .driver-bar-fill.up { background: var(--risk); left: 50%; }
  .driver-bar-fill.down { background: var(--safe); right: 50%; }

  .unreliable-note {
    font-size: 12px;
    color: var(--text-dim);
    background: var(--paper);
    border: 1px dashed var(--line-strong);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 6px;
  }

  .pcamaps {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 22px;
  }
  @media (max-width: 720px) { .pcamaps { grid-template-columns: 1fr; } }

  .pcamaps canvas {
    width: 100%;
    height: 220px;
    display: block;
    border-radius: 8px;
    background: var(--paper);
    border: 1px solid var(--line);
  }

  footer.legend {
    display: flex;
    gap: 18px;
    align-items: center;
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 8px;
  }
  footer.legend .swatch {
    width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 4px;
  }

  ::selection { background: var(--accent-soft); }
</style>

<header class="app-header">
  <div>
    <h1 class="serif">Borrower Explorer — Hybrid vs. Transformer</h1>
    <p>Pick a borrower to see how the two architectures read the same case differently: which months they attend to, which features drive the risk score, and where the borrower sits in each model's learned representation.</p>
  </div>
</header>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-controls">
      <input id="search" type="text" placeholder="Search borrower index…" />
      <select id="sort">
        <option value="index">Sort: borrower index</option>
        <option value="hybrid_risk">Sort: hybrid risk ↓</option>
        <option value="transformer_risk">Sort: transformer risk ↓</option>
      </select>
      <select id="filter">
        <option value="all">All borrowers</option>
        <option value="pos">Defaulters only</option>
        <option value="neg">Non-defaulters only</option>
      </select>
    </div>
    <div class="sidebar-list" id="sidebarList"></div>
  </aside>

  <main id="main"></main>
</div>

<script>
const DATA = JSON.parse(document.getElementById('data-json').textContent);
const MONTHS = Array.from({length: 12}, (_, i) => i + 1);

function riskBand(r) {
  if (r >= 0.60) return 'high';
  if (r >= 0.35) return 'moderate';
  return 'low';
}

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else node.setAttribute(k, v);
  }
  (children || []).forEach(c => c && node.appendChild(c));
  return node;
}

function attnStrip(values) {
  const max = Math.max(...values, 1e-9);
  const strip = el('div', { class: 'attn-strip' });
  values.forEach(v => {
    const bar = el('div', { class: 'attn-bar' });
    bar.style.height = Math.max(4, (v / max) * 100) + '%';
    bar.title = v.toFixed(5);
    strip.appendChild(bar);
  });
  const monthsRow = el('div', { class: 'attn-months' }, [
    el('span', { text: '1 (oldest)' }), el('span', { text: '12 (recent)' }),
  ]);
  const wrap = el('div', {}, [strip, monthsRow]);
  return wrap;
}

function driverList(drivers) {
  const maxAbs = Math.max(...drivers.map(d => Math.abs(d.ig_attribution)), 1e-9);
  const wrap = el('div', {});
  drivers.forEach(d => {
    const pct = (Math.abs(d.ig_attribution) / maxAbs) * 50;
    const fill = el('div', { class: 'driver-bar-fill ' + (d.direction === 'increased' ? 'up' : 'down') });
    fill.style.width = pct + '%';
    const track = el('div', { class: 'driver-bar-track' }, [fill]);
    const row = el('div', { class: 'driver' }, [
      el('span', { class: 'fname mono', text: d.feature }),
      track,
    ]);
    wrap.appendChild(row);
  });
  return wrap;
}

function modelCard(label, subtitle, modelData, attentionBlocks) {
  const card = el('div', { class: 'card' });
  card.appendChild(el('h3', { text: label }));
  card.appendChild(el('div', { class: 'subtitle', text: subtitle }));

  const band = riskBand(modelData.risk);
  card.appendChild(el('div', { class: 'risk-row' }, [
    el('span', { class: 'risk-value mono', text: modelData.risk.toFixed(3) }),
    el('span', { class: 'risk-band ' + band, text: band }),
  ]));

  attentionBlocks.forEach(([blockLabel, values]) => {
    card.appendChild(el('div', { class: 'section-label', text: blockLabel }));
    card.appendChild(attnStrip(values));
  });

  card.appendChild(el('div', { class: 'section-label', text: 'Top Integrated Gradients drivers' }));
  if (modelData.ig_reliable && modelData.ig_drivers.length) {
    card.appendChild(driverList(modelData.ig_drivers));
  } else {
    card.appendChild(el('div', { class: 'unreliable-note',
      text: 'Integrated Gradients did not converge reliably for this borrower on this model (large convergence-delta error). See 02_integrated_gradients_study.md for why this happens more often for the transformer.' }));
  }
  return card;
}

function drawPCA(canvas, allPoints, labels, highlightPoint) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, rect.width, rect.height);

  const xs = allPoints.map(p => p[0]);
  const ys = allPoints.map(p => p[1]);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  const pad = 14;
  const sx = v => pad + (v - xMin) / (xMax - xMin || 1) * (rect.width - pad * 2);
  const sy = v => rect.height - pad - (v - yMin) / (yMax - yMin || 1) * (rect.height - pad * 2);

  const styles = getComputedStyle(document.documentElement);
  const safe = styles.getPropertyValue('--safe').trim();
  const risk = styles.getPropertyValue('--risk').trim();
  const accent = styles.getPropertyValue('--accent').trim();

  allPoints.forEach((p, i) => {
    ctx.beginPath();
    ctx.arc(sx(p[0]), sy(p[1]), 1.6, 0, 2 * Math.PI);
    ctx.fillStyle = labels[i] === 1 ? risk : safe;
    ctx.globalAlpha = 0.25;
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  if (highlightPoint) {
    ctx.beginPath();
    ctx.arc(sx(highlightPoint[0]), sy(highlightPoint[1]), 6, 0, 2 * Math.PI);
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(sx(highlightPoint[0]), sy(highlightPoint[1]), 3, 0, 2 * Math.PI);
    ctx.fillStyle = accent;
    ctx.fill();
  }
}

let currentBorrower = null;

function renderMain(borrower) {
  currentBorrower = borrower;
  const main = document.getElementById('main');
  main.innerHTML = '';

  const header = el('div', { class: 'detail-header' }, [
    el('h2', { class: 'serif', text: 'Borrower #' + borrower.index }),
    el('span', { class: 'pill ' + (borrower.true_label === 1 ? 'pos' : 'neg'),
      text: borrower.true_label === 1 ? 'Defaulter' : 'Non-defaulter' }),
  ]);
  main.appendChild(header);

  const columns = el('div', { class: 'columns' }, [
    modelCard('Hybrid LSTM-GRU-Attention', 'Static-branch dominant — temporal attention barely reaches the prediction',
      borrower.hybrid, [['Attention received by month (temporal encoder)', borrower.hybrid.attention_by_month]]),
    modelCard('Transformer-Encoder Hybrid', 'Temporal-branch dominant — self-attention drives most of the prediction',
      borrower.transformer, [
        ['Attention received by month — encoder layer 1', borrower.transformer.attention_by_month_layer1],
        ['Attention received by month — encoder layer 2', borrower.transformer.attention_by_month_layer2],
      ]),
  ]);
  main.appendChild(columns);

  const pcaSection = el('div', {});
  pcaSection.appendChild(el('div', { class: 'section-label', text: 'Fused embedding (PCA) — this borrower vs. all 3,000' }));
  const maps = el('div', { class: 'pcamaps' }, [
    el('canvas', { id: 'pcaHybrid' }),
    el('canvas', { id: 'pcaTransformer' }),
  ]);
  pcaSection.appendChild(maps);
  pcaSection.appendChild(el('footer', { class: 'legend' }, [
    el('span', {}, [el('span', { class: 'swatch', style: 'background:var(--risk)' }), document.createTextNode('Defaulter')]),
    el('span', {}, [el('span', { class: 'swatch', style: 'background:var(--safe)' }), document.createTextNode('Non-defaulter')]),
    el('span', {}, [el('span', { class: 'swatch', style: 'background:var(--accent)' }), document.createTextNode('Selected borrower')]),
  ]));
  main.appendChild(pcaSection);

  requestAnimationFrame(() => {
    drawPCA(document.getElementById('pcaHybrid'), DATA.pca.hybrid.all_points, DATA.pca.hybrid.labels, borrower.hybrid.pca);
    drawPCA(document.getElementById('pcaTransformer'), DATA.pca.transformer.all_points, DATA.pca.transformer.labels, borrower.transformer.pca);
  });
}

function renderSidebar() {
  const list = document.getElementById('sidebarList');
  list.innerHTML = '';
  const search = document.getElementById('search').value.trim();
  const sort = document.getElementById('sort').value;
  const filter = document.getElementById('filter').value;

  let rows = DATA.borrowers.filter(b => {
    if (filter === 'pos' && b.true_label !== 1) return false;
    if (filter === 'neg' && b.true_label !== 0) return false;
    if (search && !String(b.index).includes(search)) return false;
    return true;
  });

  if (sort === 'hybrid_risk') rows = rows.slice().sort((a, b) => b.hybrid.risk - a.hybrid.risk);
  else if (sort === 'transformer_risk') rows = rows.slice().sort((a, b) => b.transformer.risk - a.transformer.risk);
  else rows = rows.slice().sort((a, b) => a.index - b.index);

  rows.forEach(b => {
    const row = el('div', { class: 'borrower-row' + (currentBorrower && currentBorrower.index === b.index ? ' active' : '') }, [
      el('span', { class: 'dot ' + (b.true_label === 1 ? 'pos' : 'neg') }),
      el('span', { class: 'bid mono', text: '#' + b.index }),
      el('span', { class: 'risks mono' }, [
        el('span', { text: 'H ' + b.hybrid.risk.toFixed(2) }),
        el('span', { text: 'T ' + b.transformer.risk.toFixed(2) }),
      ]),
    ]);
    row.addEventListener('click', () => { renderMain(b); renderSidebar(); });
    list.appendChild(row);
  });
}

document.getElementById('search').addEventListener('input', renderSidebar);
document.getElementById('sort').addEventListener('change', renderSidebar);
document.getElementById('filter').addEventListener('change', renderSidebar);

renderSidebar();
renderMain(DATA.borrowers.find(b => b.true_label === 1) || DATA.borrowers[0]);
window.addEventListener('resize', () => currentBorrower && renderMain(currentBorrower));
</script>
